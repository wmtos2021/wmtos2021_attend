<!-- attitude.html -->

<div class="attitudeStudentList">

    <!-- 수업태도 헤더 -->

    <div class="attitudeStudentHeader">

        <span>
            이름(성실도)
        </span>

        <span>
            수업태도
        </span>

    </div>

    <!-- 학생 목록 스크롤 영역 -->

    <div
        id="attitudeStudentRows"
        class="attitudeStudentRows">
    </div>

</div>

<!-- 학생 행 템플릿 -->

<template id="attitudeStudentTemplate">

    <div class="attitudeStudentRow">

        <!-- 학생 이름 -->

        <span class="attitudeStudentName">

            <span class="attitudeStudentNameText">
            </span>

            <span class="attitudeStudentDiligence">
            </span>

        </span>

        <!-- 수업태도 버튼 -->

        <span class="attitudeButtons">

            <button
                class="attitudeBtn"
                data-value="-100"
                type="button">
                -100P
            </button>

            <button
                class="attitudeBtn"
                data-value="-50"
                type="button">
                -50P
            </button>

            <span class="attitudeZero">0</span>

            <button
                class="attitudeBtn"
                data-value="50"
                type="button">
                +50P
            </button>

            <button
                class="attitudeBtn"
                data-value="100"
                type="button">
                +100P
            </button>

        </span>

    </div>

</template>
