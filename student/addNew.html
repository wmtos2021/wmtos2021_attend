<!-- addNew.html -->

<div class="addNew">
    <div class="addNewHeader">
        <h3>학생 등록</h3>

        <button id="studentAddSubmit" type="button">
            등록완료
        </button>
    </div>

    <div class="addNewForm">
        <div class="addNewField">
            <label for="studentName">이름</label>

            <div class="addNewInputGroup">
                <input id="studentName" type="text" autocomplete="off">

                <button id="studentNameCheck" type="button">
                    중복확인
                </button>

                <button id="studentNameEdit" type="button" disabled>
                    수정
                </button>
            </div>

            <p id="studentNameMessage"></p>
        </div>

        <div class="addNewField">
            <label for="studentMobile">전화번호</label>

            <div class="addNewInputGroup">
                <input
                    id="studentMobile"
                    type="tel"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="010-0000-0000">

                <button id="studentMobileCheck" type="button">
                    중복확인
                </button>

                <button id="studentMobileEdit" type="button" disabled>
                    수정
                </button>
            </div>

            <p id="studentMobileMessage"></p>
        </div>

        <div class="addNewField">
            <label for="studentBirthday">생년월일</label>

            <input
                id="studentBirthday"
                type="text"
                inputmode="numeric"
                maxlength="10"
                autocomplete="off"
                placeholder="8자리 입력해주세요.">
        </div>

        <div class="addNewField">
            <label for="studentEnrollment">등록일</label>

            <input
                id="studentEnrollment"
                type="text"
                inputmode="numeric"
                maxlength="10"
                autocomplete="off"
                placeholder="8자리 입력해주세요.">
        </div>

        <div class="addNewClass">
            <span>수강 과목 및 수업</span>

            <div class="addNewClassSelect">
                <select id="studentSubject">
                    <option value="math" selected>수학</option>
                </select>

                <select id="studentClass">
                    <option value="" disabled selected>
                        수업을 선택하세요.
                    </option>
                </select>
            </div>
        </div>

        <p id="studentAddMessage"></p>
    </div>
</div>

<!-- 안내 팝업 -->
<div id="studentCheckPopup" class="studentAddPopup">
    <div class="studentAddPopupBox">
        <p id="studentCheckPopupMessage"></p>
        <button id="studentCheckPopupClose" type="button">확인</button>
    </div>
</div>

<!-- 학생 등록 완료 팝업 -->
<div id="studentAddPopup" class="studentAddPopup">
    <div class="studentAddPopupBox">
        <p>학생 등록이 완료되었습니다.</p>
        <button id="studentAddPopupClose" type="button">확인</button>
    </div>
</div>
