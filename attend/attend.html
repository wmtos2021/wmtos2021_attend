<!-- attend.html -->

<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>출석체크</title>

    <link rel="stylesheet" href="attend.css">

</head>

<body>

    <div class="container">

        <!-- 출석 버튼 -->
        <div class="attendButton">

            <img
                id="attendImage"
                src="../image/attend_투명.webp"
                alt="출석체크">

        </div>

    </div>


    <!-- 출석 결과 팝업 -->
    <div
        id="attendModal"
        class="attendModal hidden">

        <div class="attendModalBox">

            <!-- 출석 확인 이미지 -->
            <img
                id="resultAttendImage"
                src=""
                alt="출석 도장">

            <!-- 오늘의 명언 -->
            <div
                id="wisdomTitle"
                class="wisdomTitle">
            </div>

            <div
                id="wisdomMessage"
                class="wisdomMessage">
            </div>


            <!-- 출석 포인트 -->
            <div class="pointArea">
                
                <div
                    id="attendPoint"
                    class="attendPoint">
                </div>

            </div>

            <!-- 확인 버튼 -->
            <button
                id="attendConfirmBtn"
                type="button">
                확인
            </button>

        </div>
    </div>


    <!-- 알림 팝업 -->
    <div
        id="alertModal"
        class="alertModal hidden">

        <div class="alertModalBox">

            <div
                id="alertMessage"
                class="alertMessage">
            </div>

            <button
                id="alertConfirmBtn"
                type="button">
                확인
            </button>

        </div>
    </div>


    <div class="footerLine"></div>    
    
    <div class="footerLeft">

        <div class="footerLine1">
            <span class="footerW">위드</span><span class="footerM">엠</span><span class="footerTos">투에스</span><span class="footerAcademy">학원</span>
        </div>

        <div class="footerLine2">
            경남 김해시 활천로 168, 2층
        </div>

    </div>    


    <div class="footerRight">
        Ver 1.0.3
    </div>


    <script
        type="module"
        src="attend.js">
    </script>

</body>

</html>
