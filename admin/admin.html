<!-- admin.html -->

<!DOCTYPE html>

<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자</title>
    <link rel="stylesheet" href="./admin.css">
    <link rel="stylesheet" href="./adminNews.css">
    <link rel="stylesheet" href="./inbox.css">
</head>

<body>

```
<div class="container">

    <!-- 상단 -->
    <header class="header">

        <div class="leftHeader">

            <p class="hello">
                오늘도 힘내요!
            </p>

            <h2 class="title">
                관리자님
            </h2>

        </div>

        <div class="rightHeader">

            <button
                id="informBtn"
                class="informBtn"
                type="button"
                aria-label="알림">

                <img
                    src="../imageAdmin/bell.webp"
                    class="bellIcon"
                    alt="">

                <span
                    id="informBadge"
                    class="informBadge hidden">
                </span>

            </button>

        </div>

    </header>

    <hr class="line">

    <!-- 상단 메뉴 + 드롭다운 -->
    <div class="menuArea">

        <!-- 상단 메뉴 -->
        <nav class="mainMenu">

            <button
                id="studentMenuBtn"
                class="mainMenuBtn"
                type="button"
                aria-expanded="false">

                <span>
                    학생관리
                </span>

                <span
                    class="menuArrow"
                    aria-hidden="true">
                    ▾
                </span>

            </button>

            <button
                id="academyMenuBtn"
                class="mainMenuBtn"
                type="button"
                aria-expanded="false">

                <span>
                    학원관리
                </span>

                <span
                    class="menuArrow"
                    aria-hidden="true">
                    ▾
                </span>

            </button>

            <button
                id="etcMenuBtn"
                class="mainMenuBtn"
                type="button"
                aria-expanded="false">

                <span>
                    기타관리
                </span>

                <span
                    class="menuArrow"
                    aria-hidden="true">
                    ▾
                </span>

            </button>

        </nav>

        <!-- 드롭다운 -->
        <div
            id="menuPanel"
            class="menuPanel hidden">

            <!-- 학생관리 -->
            <div
                id="studentPanel"
                class="panelContent hidden">

                <button
                    id="studentListBtn"
                    class="panelItem"
                    type="button">

                    <span class="panelItemTitle">
                        학생 조회<span class="menuDivider">/</span>관리
                    </span>

                </button>

                <button
                    id="studentAddBtn"
                    class="panelItem"
                    type="button">

                    <span class="panelItemTitle">
                        학생 등록
                    </span>

                </button>

            </div>

            <!-- 학원관리 -->
            <div
                id="academyPanel"
                class="panelContent hidden">

                <button
                    id="scheduleBtn"
                    class="panelItem"
                    type="button">

                    <span class="panelItemTitle">
                        시간표 관리
                    </span>

                </button>

                <button
                    id="teacherBtn"
                    class="panelItem"
                    type="button">

                    <span class="panelItemTitle">
                        선생님 등록
                    </span>

                </button>

            </div>

            <!-- 기타관리 -->
            <div
                id="etcPanel"
                class="panelContent hidden">

                <button
                    id="goldShopBtn"
                    class="panelItem"
                    type="button">

                    <span class="panelItemTitle">
                        골드상점 관리
                    </span>

                </button>

                <button
                    id="newsHistoryBtn"
                    class="panelItem"
                    type="button">

                    <span class="panelItemTitle">
                        NEWS 조회
                    </span>

                </button>

            </div>

        </div>

    </div>

    <!-- 콘텐츠 위 구분선 -->
    <hr class="contentLine">

    <!-- 콘텐츠 -->
    <main
        id="contentArea"
        class="contentArea">

        <!-- 기본 화면 -->
        <div
            id="defaultContent"
            class="defaultContent">

            <p>
                관리할 메뉴를 선택해주세요.
            </p>

        </div>

        <!-- 시간표 -->
        <section
            id="scheduleContent"
            class="pageContent hidden">

            <h3>
                시간표 작성/관리
            </h3>

        </section>

        <!-- 선생님 -->
        <section
            id="teacherContent"
            class="pageContent hidden">

            <h3>
                선생님 등록/관리
            </h3>

        </section>

        <!-- 학생 등록 -->
        <section
            id="studentAddContent"
            class="pageContent hidden">

            <h3>
                학생 등록
            </h3>

        </section>

        <!-- 학생 조회 -->
        <section
            id="studentListContent"
            class="pageContent hidden">

            <h3>
                학생 조회/관리
            </h3>

        </section>

        <!-- 골드상점 -->
        <section
            id="goldShopContent"
            class="pageContent hidden">

            <h3>
                골드상점 관리
            </h3>

        </section>

        <!-- NEWS 조회 -->
        <section
            id="newsHistoryContent"
            class="pageContent hidden">

            <h3>
                NEWS 조회
            </h3>

            <div
                id="newsHistoryList"
                class="newsHistoryList">
            </div>

        </section>

    </main>

    <!-- 하단 구분선 -->
    <hr class="footerLine">

</div>

<!-- NEWS 팝업 -->
<div
    id="informModal"
    class="informModal hidden">

    <div class="informModalBox">

        <h3 class="informModalTitle">

            NEWS

            <button
                id="informModalClose"
                class="informModalClose"
                type="button"
                aria-label="NEWS 닫기">
            </button>

        </h3>

        <div class="informModalLine"></div>

        <div
            id="informModalList"
            class="informModalList">
        </div>

    </div>

</div>

<!-- 하단 왼쪽 정보 -->
<div class="footerLeft">

    <div class="footerLine1"></div>
    <div class="footerLine2"></div>

</div>

<!-- 하단 오른쪽 정보 -->
<div
    class="footerRight"
    id="version">
</div>

<script type="module" src="./admin.js"> </script>


</body>

</html>
